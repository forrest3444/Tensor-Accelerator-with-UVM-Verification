- id: WVR-CODE-FSM-001
  vtrack_id: VTR-FSM-001
  status: proposed
  coverage_type: fsm
  source_file: rtl/control/command_fsm.sv
  scope:
    module: command_fsm
    instance: top_tb.u_dut.u_command_fsm
  location:
    transitions:
    - ST_CHECK_CONFIG -> ST_IDLE
    - ST_COMPUTE_TILE -> ST_IDLE
    - ST_PIPE_WAIT_COMPUTE -> ST_IDLE
    - ST_PIPE_WAIT_LOAD -> ST_IDLE
    - ST_PREPARE_TILE -> ST_IDLE
    - ST_STORE_TILE -> ST_IDLE
    - ST_WAIT_FINAL_STORE -> ST_IDLE
    uncovered_detail: Seven reset-only transitions explicitly selected in dve_waivers.el. The two excluded
      source states are recorded separately.
  title: 'command_fsm: 7 explicitly excluded reset-only transitions to ST_IDLE'
  rationale: These seven active states have no combinational transition to ST_IDLE; reset or soft reset
    assigns state_q directly. Exact exclusion scope follows dve_waivers.el.
  risk: low
  expiry: Revisit if command_fsm adds abort/flush/cancel semantics that return to IDLE from active states.
  verification: 'Static RTL review: inspected always_comb case block for each state. Confirmed no state_d=ST_IDLE
    assignment outside ST_DONE/ST_ERROR/default.'
