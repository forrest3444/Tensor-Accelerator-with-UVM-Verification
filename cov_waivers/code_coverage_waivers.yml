- id: WVR-CODE-DMAW-001
  vtrack_id: VTR-DMAW-001
  status: proposed
  coverage_type: fsm
  source_file: rtl/dma/axi_write_dma.sv
  scope:
    module: axi_write_dma
    instance: top_tb.u_dut.u_tensor_writer.u_axi_write_dma
  location:
    transitions:
    - S_START -> S_IDLE
    - S_SPLIT -> S_IDLE
    - S_PLAN -> S_IDLE
    - S_AW -> S_IDLE
    - S_READ_REQ -> S_IDLE
    - S_READ_DATA -> S_IDLE
    - S_W -> S_IDLE
    - S_B -> S_IDLE
    - S_B_RESP -> S_IDLE
    uncovered_detail: 'Only S_DONE has a functional state_d=S_IDLE path in the always_comb case block
      (S_DONE: state_d = S_IDLE). All other states transition to other active states or S_DONE. The nine
      listed transitions can only be reached via rst_n=0 in the always_ff block, bypassing state_d entirely.

      '
  title: 'axi_write_dma: 9 non-DONE states -> S_IDLE are reset-only'
  rationale: 'In the always_comb case block, only S_DONE assigns state_d=S_IDLE. All other states have
    functional transitions to S_START, S_SPLIT, S_PLAN, S_AW, S_READ_REQ, S_READ_DATA, S_W, S_B, S_B_RESP,
    or S_DONE. The always_ff block forces state_q<=S_IDLE on !rst_n without going through state_d, making
    these transitions observable only as reset paths, not functional stimuli.

    '
  risk: low
  expiry: Revisit if axi_write_dma adds abort/flush semantics returning to IDLE from active states.
  verification: 'Static RTL review: inspected always_comb case block. Confirmed state_d=S_IDLE only in
    S_DONE and default.'
